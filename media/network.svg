<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Circuit of two pi-model transmission lines and an RL load"><rect width="900" height="300" rx="12" fill="#f6f7f9"/><line x1="60" y1="150" x2="840" y2="150" stroke="#222" stroke-width="2"/><line x1="60" y1="230" x2="840" y2="230" stroke="#222" stroke-width="2"/><circle cx="60" cy="190" r="20" fill="#fff" stroke="#222" stroke-width="2"/><text x="60" y="195" text-anchor="middle" font-size="14">u1</text><circle cx="840" cy="190" r="20" fill="#fff" stroke="#222" stroke-width="2"/><text x="840" y="195" text-anchor="middle" font-size="14">u2</text><line x1="60" y1="150" x2="60" y2="170" stroke="#222" stroke-width="2"/><line x1="60" y1="210" x2="60" y2="230" stroke="#222" stroke-width="2"/><line x1="840" y1="150" x2="840" y2="170" stroke="#222" stroke-width="2"/><line x1="840" y1="210" x2="840" y2="230" stroke="#222" stroke-width="2"/><rect x="150" y="136" width="60" height="28" fill="#fff" stroke="#222" stroke-width="2"/><text x="180" y="128" text-anchor="middle" font-size="13">R1 = 30 Ω</text><rect x="240" y="136" width="60" height="28" fill="#fff" stroke="#222" stroke-width="2"/><text x="270" y="128" text-anchor="middle" font-size="13">L1 = 0.1 H</text><rect x="600" y="136" width="60" height="28" fill="#fff" stroke="#222" stroke-width="2"/><text x="630" y="128" text-anchor="middle" font-size="13">R2 = 30 Ω</text><rect x="690" y="136" width="60" height="28" fill="#fff" stroke="#222" stroke-width="2"/><text x="720" y="128" text-anchor="middle" font-size="13">L2 = 0.2 H</text><line x1="110" y1="150" x2="110" y2="172" stroke="#222" stroke-width="2"/><line x1="96" y1="172" x2="124" y2="172" stroke="#222" stroke-width="2"/><line x1="96" y1="180" x2="124" y2="180" stroke="#222" stroke-width="2"/><line x1="110" y1="180" x2="110" y2="230" stroke="#222" stroke-width="2"/><text x="130" y="180" font-size="14">C1</text><text x="130" y="196" font-size="11" fill="#555">0.5 µF</text><line x1="340" y1="150" x2="340" y2="172" stroke="#222" stroke-width="2"/><line x1="326" y1="172" x2="354" y2="172" stroke="#222" stroke-width="2"/><line x1="326" y1="180" x2="354" y2="180" stroke="#222" stroke-width="2"/><line x1="340" y1="180" x2="340" y2="230" stroke="#222" stroke-width="2"/><text x="360" y="180" font-size="14">C1</text><text x="360" y="196" font-size="11" fill="#555">0.5 µF</text><line x1="560" y1="150" x2="560" y2="172" stroke="#222" stroke-width="2"/><line x1="546" y1="172" x2="574" y2="172" stroke="#222" stroke-width="2"/><line x1="546" y1="180" x2="574" y2="180" stroke="#222" stroke-width="2"/><line x1="560" y1="180" x2="560" y2="230" stroke="#222" stroke-width="2"/><text x="580" y="180" font-size="14">C2</text><text x="580" y="196" font-size="11" fill="#555">1.5 µF</text><line x1="790" y1="150" x2="790" y2="172" stroke="#222" stroke-width="2"/><line x1="776" y1="172" x2="804" y2="172" stroke="#222" stroke-width="2"/><line x1="776" y1="180" x2="804" y2="180" stroke="#222" stroke-width="2"/><line x1="790" y1="180" x2="790" y2="230" stroke="#222" stroke-width="2"/><text x="810" y="180" font-size="14">C2</text><text x="810" y="196" font-size="11" fill="#555">1.5 µF</text><rect x="425" y="140" width="50" height="22" fill="#fff" stroke="#222" stroke-width="2"/><text x="450" y="156" text-anchor="middle" font-size="12">RL</text><rect x="425" y="192" width="50" height="22" fill="#fff" stroke="#222" stroke-width="2"/><text x="450" y="208" text-anchor="middle" font-size="12">LL</text><line x1="450" y1="150" x2="450" y2="140" stroke="#222" stroke-width="2"/><line x1="450" y1="162" x2="450" y2="192" stroke="#222" stroke-width="2"/><line x1="450" y1="214" x2="450" y2="230" stroke="#222" stroke-width="2"/><text x="450" y="118" text-anchor="middle" font-size="14" fill="#B03000">u_load (output, state x4)</text><text x="450" y="268" text-anchor="middle" font-size="12" fill="#555">line 1 (100 km) | load RL = 10